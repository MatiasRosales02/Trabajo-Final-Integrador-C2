<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Biblioteca virtual de la UTN-FRT para las tecnicaturas">
    <meta name="keywords"
        content="UTN, UTN-FRT, Biblioteca UTN, Biblioteca Virtual UTN, Tecnicaturas, Tecnicaturas UTN, Tecnicaturas UTN-FRT, Programación UTN, Programación UTN-FRT, Higiene y seguridad UTN, Higiene y seguridad UTN-FRT, Logística UTN, Logística UTN-FRT, Desarrollo de videojuegos UTN, Desarrollo de videojuegos UTN-FRT, Mecatrónica UTN, Mecatrónica UTN-FRT, mantenimiento industrial UTN, energías renovables UTN, profesores UTN, material de estudio UTN">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--fuente-->
    <!-- Conexión previa para optimizar la carga -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Importación de la fuente Inter desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <!--links-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" href="/img/logo-utn-3.jpg">
    <link rel="stylesheet" href="/style.css">
    <title>FRT-UTN | Biblioteca digital</title>
</head>

<body>
    <header class="header">
        <nav class="navbar navbar-expand-md" aria-label="Navegación principal">
            <div class="container-fluid">
                <a class="navbar-brand logo" href="#"><span class="logo-color1">Biblio</span><span
                        class="logo-color2">teca</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto gap-4 me-5">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#tecnicaturas">Tecnicaturas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#profesores">Profesores</a></li>
                    <li class="nav-item"><a class="nav-link" href="#recursos">Recursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Nosotros</a></li>
                    <li class="nav-item dropdown"><a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Cuenta</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Mi perfil</a></li>
                            <li><a class="dropdown-item" href="#">Subir</a></li>
                            <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
                        </ul>
                    </li>
                </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 px-4 pb-5 pt-5">
        <section id="nosotro"
            class="nosotros text-center p-4 pt-5 pb-4 min-vh-40 d-flex flex-column justify-content-center align-items-center mb-5 rounded-4 border border-white border-opacity-10"
            aria-labelledby="titulo-nosotros">
            <div>
                <h1 id="titulo-nosotros" class="display-5 fw-bold mb-3">Biblioteca digital FRT-UTN</h1>
                <p class="fs-5 mx-auto lh-base max-w-700">Bienvenido a la biblioteca digital de las Tecnicaturas de la
                    Facultad Regional Tucumán de la
                    Universidad Tecnológica Nacional.</p>
            </div>
        </section>

        <section id="carrusel" class="mb-5">
            <div id="carouselExampleDark" class="carousel carousel-dark slide">
                <div class="carousel-indicators">
                    <button id="btn-indicadorCarrusel" type="button" data-bs-target="#carouselExampleDark"
                        data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button id="btn-indicadorCarrusel" type="button" data-bs-target="#carouselExampleDark"
                        data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button id="btn-indicadorCarrusel" type="button" data-bs-target="#carouselExampleDark"
                        data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="10000">
                        <img src="/img/utn-1.jpg" class="d-block w-100" alt="...">
                        <div class="carousel-caption d-none d-md-block">
                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="2000">
                        <img src="/img/utn-2.jpg" class="d-block w-100" alt="...">
                        <div class="carousel-caption d-none d-md-block">
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="/img/utn-3.jpg" class="d-block w-100" alt="...">
                        <div class="carousel-caption d-none d-md-block">
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
    </main>
    <!-- Footer will be inserted here -->
    <div id="footer"></div>

    <script>
        fetch("/components/footer.html")
            .then(response => response.text())
            .then(html => {
                document.getElementById("footer").innerHTML = html;
            });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
